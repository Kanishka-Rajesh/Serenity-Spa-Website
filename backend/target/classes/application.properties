# Server Configuration
server.port=8080

# Application Profiles (default uses mysql; dev/test can use h2)
spring.profiles.active=mysql

# Application Properties
app.jwt.secret=${JWT_SECRET:SerenitySpaSuperSecretKeyThatMustBeAtLeast256BitsLongForHMACSHA256Security123456}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
